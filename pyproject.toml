[project]
name = "chess-trainer"
version = "0.1.0"
description = "Personal chess trainer built on locally analyzed Lichess games"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.setuptools]
packages = ["chess_trainer"]
